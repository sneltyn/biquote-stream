nodeLinker: node-modules

# NO `yarnPath` on purpose. The version is pinned by `packageManager` in
# package.json and materialised by Corepack (bundled with Node >= 16.9), so the
# exact Yarn is guaranteed everywhere WITHOUT committing its 2.7 MB runtime.
# Setting yarnPath here would point at a file `.gitignore` excludes, which is
# how a fresh clone ends up with no package manager at all.
